version: '3.9'

# Development override — only infrastructure services
services:
  postgres:
    image: postgres:16-alpine
    container_name: adspy-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: adspy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adspy-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
