name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

jobs:
  backup:
    name: Backup PostgreSQL to S3
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump
        run: sudo apt-get install -y postgresql-client

      - name: Dump database
        run: |
          DATE=$(date +%Y-%m-%d-%H%M)
          FILENAME="backup_${DATE}.sql.gz"
          pg_dump "$DATABASE_URL" | gzip > "$FILENAME"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload to S3
        run: |
          aws s3 cp "$FILENAME" "s3://$S3_BUCKET/backups/$FILENAME"
          echo "✅ Backup uploaded: $FILENAME"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}

      - name: Cleanup old backups (keep 30 days)
        run: |
          CUTOFF=$(date -d "30 days ago" +%Y-%m-%d)
          aws s3 ls "s3://$S3_BUCKET/backups/" | while read -r line; do
            FILE=$(echo "$line" | awk '{print $4}')
            DATE=$(echo "$FILE" | grep -oP '\d{4}-\d{2}-\d{2}' | head -1)
            if [[ "$DATE" < "$CUTOFF" ]]; then
              aws s3 rm "s3://$S3_BUCKET/backups/$FILE"
              echo "Deleted old backup: $FILE"
            fi
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
