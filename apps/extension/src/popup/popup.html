<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdSpy Miner</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Login View -->
      <div id="login-view" class="view hidden">
        <div class="header">
          <div class="logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">AdSpy</span>
          </div>
          <p class="tagline">Facebook Ads Intelligence</p>
        </div>
        <form id="login-form" class="form">
          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <div id="login-error" class="error hidden"></div>
          <button type="submit" class="btn btn-primary" id="login-btn">
            Sign In
          </button>
        </form>
        <div class="divider"></div>
        <div class="field">
          <label>API URL</label>
          <input type="url" id="api-url" placeholder="https://api.yourdomain.com" />
          <small>Leave empty for default</small>
        </div>
      </div>

      <!-- Dashboard View -->
      <div id="dashboard-view" class="view hidden">
        <div class="header">
          <div class="logo">
            <span class="logo-icon">⚡</span>
            <span class="logo-text">AdSpy</span>
          </div>
          <button id="logout-btn" class="btn-icon" title="Logout">⎋</button>
        </div>

        <div class="user-info">
          <span id="user-email" class="user-email"></span>
          <span id="user-plan" class="plan-badge"></span>
        </div>

        <div class="status-card">
          <div class="status-row">
            <span class="status-label">Mining Status</span>
            <span id="mining-status" class="status-badge inactive">Inactive</span>
          </div>
          <div class="stats-row">
            <div class="stat">
              <span id="session-count" class="stat-value">0</span>
              <span class="stat-label">This Session</span>
            </div>
            <div class="stat">
              <span id="total-count" class="stat-value">—</span>
              <span class="stat-label">Total Ads</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="mine-now-btn" class="btn btn-primary">
            ⚡ Mine Now
          </button>
          <button id="toggle-auto-btn" class="btn btn-secondary">
            ⏱ Start Auto-Mine
          </button>
        </div>

        <div class="page-info">
          <span id="page-status" class="page-status"></span>
        </div>

        <div class="footer-links">
          <a id="dashboard-link" href="#" class="link">Open Dashboard</a>
          <span class="separator">·</span>
          <a href="https://www.facebook.com/ads/library/" target="_blank" class="link">Ads Library</a>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading-view" class="view">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
